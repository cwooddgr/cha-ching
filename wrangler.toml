name = "cha-ching"
main = "src/index.js"
compatibility_date = "2026-07-01"
# workers.dev stays enabled on purpose: Apple's notification POSTs and the
# backfill script target it. Humans use cha-ching.dgrlabs.co, behind
# Cloudflare Access — the worker refuses dashboard/data routes elsewhere.
workers_dev = true

routes = [
  { pattern = "cha-ching.dgrlabs.co", custom_domain = true },
]

[vars]
# "1" since 2026-08-07: the Cloudflare Access application "Cha-Ching Dashboard"
# (one-time PIN, dgrlabs.cloudflareaccess.com) is live in front of
# cha-ching.dgrlabs.co. Set to "0" to fail closed (503) if Access is ever removed.
ACCESS_ENABLED = "1"

[[d1_databases]]
binding = "DB"
database_name = "cha-ching"
database_id = "c30fcea4-f3bb-463a-8092-efade8d12120"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
