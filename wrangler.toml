name = "cha-ching"
main = "src/index.js"
compatibility_date = "2026-07-01"
# workers.dev stays enabled on purpose: Apple's notification POSTs and the
# backfill script target it. Humans use rev-9000.dgrlabs.co, behind
# Cloudflare Access — the worker refuses dashboard/data routes elsewhere.
workers_dev = true

routes = [
  # rev-9000.dgrlabs.co is the dashboard's hostname; cha-ching.dgrlabs.co stays
  # attached so old bookmarks land on a redirect rather than a dead name. The
  # repo, the Worker and the D1 database keep the cha-ching name.
  { pattern = "rev-9000.dgrlabs.co", custom_domain = true },
  { pattern = "cha-ching.dgrlabs.co", custom_domain = true },
]

[vars]
# "1" since 2026-08-07: the Cloudflare Access application "Cha-Ching Dashboard"
# (one-time PIN, dgrlabs.cloudflareaccess.com) is live in front of
# both rev-9000.dgrlabs.co and the legacy cha-ching.dgrlabs.co (added to the
# same app 2026-08-10 during the rename). Set to "0" to fail closed (503) if
# Access is ever removed.
ACCESS_ENABLED = "1"

# The ANALYST CONSOLE's backend: agent-bridge on bigiron, reached over a
# Cloudflare tunnel. Not a secret (the bearer is CHAT_TOKEN, a worker secret
# that must match /etc/agent-bridge/config.json on bigiron). The agent runs on
# Charlie's Claude subscription rather than the Anthropic API — which is why
# there is no ANTHROPIC_API_KEY here any more. Adding one back would silently
# move billing.
CHAT_BRIDGE_URL = "https://bridge.dgrlabs.co"

# Cloudflare account the Analytics Engine datasets live in (Overflight's
# telemetry). Not a secret; the token that reads it is (CF_ANALYTICS_TOKEN).
CF_ACCOUNT_ID = "85d08ef7cddb0aa4ed18d8fd40e5576b"

# Rolling DAU/WAU/MAU from Overflight's own telemetry, snapshotted once a day
# into `active_users` (snapshotActiveUsers). 01:20 UTC: yesterday's UTC day is
# complete and Analytics Engine has ingested it. Reads the AE SQL API with the
# CF_ANALYTICS_TOKEN secret (Account Analytics Read) against CF_ACCOUNT_ID.
[triggers]
crons = ["20 1 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cha-ching"
database_id = "c30fcea4-f3bb-463a-8092-efade8d12120"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
